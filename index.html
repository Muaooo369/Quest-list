<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勝利清單_v1.1</title>
<style>
  :root {
    --bg: #14161a;
    --card: #1f2329;
    --line: #2d333b;
    --text: #e8eaed;
    --muted: #8b949e;
    --accent: #4aa3ff;
    --win: #f5c542;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 14px 60px; }
  h1 { font-size: clamp(22px, 5vw, 30px); margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .add { display: flex; gap: 8px; margin-bottom: 18px; }
  .add input { flex: 1; min-width: 0; padding: 14px; font-size: 18px; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; outline: none; }
  .add input:focus { border-color: var(--accent); }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 10px; }
  .btn-add { padding: 0 20px; font-size: 18px; font-weight: 700; background: var(--accent); color: #07121f; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; }
  li .t { flex: 1; font-size: 19px; line-height: 1.4; word-break: break-word; }
  li.done .t { text-decoration: line-through; color: var(--muted); }
  .btn-done { padding: 12px 16px; font-size: 17px; font-weight: 700; background: var(--win); color: #2a2000; white-space: nowrap; }
  .btn-done:active { transform: scale(.96); }
  li.done .btn-done { background: var(--line); color: var(--muted); cursor: default; }
  .btn-del { padding: 10px 12px; font-size: 16px; background: transparent; color: var(--muted); }
  .btn-del:hover { color: #ff6b6b; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px;
    color: var(--muted); font-size: 14px; }
  .btn-clear { padding: 8px 14px; font-size: 14px; background: var(--card); color: var(--muted); border: 1px solid var(--line); }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .ver { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; }
  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99; }
  @media (max-width: 480px) {
    li { flex-wrap: wrap; }
    li .t { flex-basis: 100%; }
    .btn-done { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏆 今日勝利清單</h1>
  <div class="sub">輸入今天要做的事,做完按「完成任務」</div>

  <div class="add">
    <input id="inp" type="text" placeholder="輸入工作項目,按 Enter 新增" autocomplete="off">
    <button class="btn-add" id="addBtn">新增</button>
  </div>

  <ul id="list"></ul>

  <div class="foot">
    <span id="stat"></span>
    <button class="btn-clear" id="clearBtn">清除已完成</button>
  </div>
  <div class="ver">勝利清單_v1.1</div>
</div>
<canvas id="fx"></canvas>

<script>
// 音效檔名(放在同一個資料夾),會依序嘗試不同副檔名
const SOUND_BASE = "ff7_victory";
const SOUND_EXTS = ["mp3"];
// 全部任務完成後要跳轉的頁面(放在同一個資料夾)
const VICTORY_PAGE = "victory.html";
// 最後一項完成後,先讓紙花和音效跑一下再跳轉(毫秒)
const JUMP_DELAY = 1500;

const KEY = "victory_todo_v1";
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { items = []; }

const $ = id => document.getElementById(id);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} };

function render() {
  const ul = $("list");
  ul.innerHTML = "";
  if (!items.length) {
    ul.innerHTML = '<div class="empty">還沒有任務,先加一個吧</div>';
  }
  items.forEach(it => {
    const li = document.createElement("li");
    if (it.done) li.className = "done";
    const t = document.createElement("div");
    t.className = "t"; t.textContent = it.text;
    const b = document.createElement("button");
    b.className = "btn-done";
    b.textContent = it.done ? "已完成 ✓" : "完成任務";
    if (!it.done) b.onclick = e => complete(it.id, e.currentTarget);
    const d = document.createElement("button");
    d.className = "btn-del"; d.textContent = "✕"; d.title = "刪除";
    d.onclick = () => { items = items.filter(x => x.id !== it.id); save(); render(); };
    li.append(t, b, d);
    ul.appendChild(li);
  });
  const done = items.filter(x => x.done).length;
  $("stat").textContent = `已完成 ${done} / ${items.length}`;
}

function add() {
  const v = $("inp").value.trim();
  if (!v) return;
  items.push({ id: Date.now() + Math.random(), text: v, done: false });
  $("inp").value = "";
  save(); render();
  $("inp").focus();
}

function complete(id, btn) {
  const it = items.find(x => x.id === id);
  if (!it || it.done) return;
  const r = btn.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  it.done = true;
  save(); render();
  playSound();
  confetti(x, y);
  const all = items.length && items.every(i => i.done);
  if (all) {
    setTimeout(() => { confetti(innerWidth * .25, innerHeight * .6); confetti(innerWidth * .75, innerHeight * .6); }, 350);
    setTimeout(() => { location.href = VICTORY_PAGE; }, JUMP_DELAY);
  }
}

// ---------- 音效 ----------
let audio = null;
function playSound() {
  let i = 0;
  const tryNext = () => {
    if (i >= SOUND_EXTS.length) return;
    const a = new Audio(`${SOUND_BASE}.${SOUND_EXTS[i++]}`);
    a.addEventListener("error", tryNext, { once: true });
    a.play().then(() => { if (audio) audio.pause(); audio = a; }).catch(() => {});
  };
  tryNext();
}

// ---------- 灑花 ----------
const cv = $("fx"), ctx = cv.getContext("2d");
function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
resize(); addEventListener("resize", resize);
let parts = [], running = false;
const COLORS = ["#f5c542", "#4aa3ff", "#ff6b9d", "#5ce08a", "#b388ff", "#ff9f43"];

function confetti(x, y) {
  for (let i = 0; i < 90; i++) {
    const a = Math.random() * Math.PI * 2, s = 6 + Math.random() * 10;
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: COLORS[(Math.random() * COLORS.length) | 0], life: 0
    });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  const k = devicePixelRatio;
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life < 110 && p.y < innerHeight + 40);
  parts.forEach(p => {
    p.life++; p.vy += .35; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    ctx.save();
    ctx.translate(p.x * k, p.y * k); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, 1 - p.life / 110);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.w * k / 2, -p.h * k / 2, p.w * k, p.h * k);
    ctx.restore();
  });
  if (parts.length) requestAnimationFrame(tick);
  else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
}

$("addBtn").onclick = add;
$("inp").addEventListener("keydown", e => { if (e.key === "Enter") add(); });
$("clearBtn").onclick = () => { items = items.filter(x => !x.done); save(); render(); };
render();
</script>
</body>
</html>
